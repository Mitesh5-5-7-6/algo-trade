version: "3.8"

services:
  mongo:
    image: mongo:7.0
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7.2-alpine
    restart: always
    # Enable AOF per deployment guidelines (plan/22 §6)
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    depends_on:
      - mongo
      - redis
    # The API reads env vars, so we map them here
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/algotrade
      - REDIS_URI=redis://redis:6379
      - NODE_ENV=production
      # Mock keys for staging
      - FYERS_APP_ID=staging_app
      - FYERS_SECRET_ID=staging_secret
      - REDIRECT_URI=http://localhost/auth/callback
      - SESSION_SECRET=staging_session_secret_32_bytes!
      - TOKEN_ENCRYPTION_KEY=staging_token_encryption_key_32b!
    ports:
      - "3000:3000"

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    restart: always
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  mongo_data:
  redis_data:
