# Local infrastructure for the integration suites (§0.4).
#
#   docker compose -f docker-compose.test.yml up -d
#   pnpm test:integration
#
# The images and ports deliberately mirror `.github/workflows/ci.yml`, so a
# local strict run and a CI run exercise the same servers. Divergence between
# the two is how "green locally, red in CI" becomes a recurring mystery.
services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
